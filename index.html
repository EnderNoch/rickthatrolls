<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>&nbsp;</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;            /* strona nie ma czego przewijać */
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  #v {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* dvw/dvh ignorują chowające się paski przeglądarki na mobile.
       Linie wyżej są fallbackiem dla starszych silników. */
    width: 100dvw;
    height: 100dvh;
    object-fit: cover;           /* wypełnia okno, brak czarnych pasków */
    object-position: center center;
    background: #000;
    display: block;

    /* Kluczowa linia. Wideo przestaje być celem trafienia kursora/palca,
       więc przeglądarka nie ma dla niego menu kontekstowego — pozycje
       „Pokaż elementy sterujące", „Zapisz wideo jako…", „Zapętl",
       „Obraz w obrazie" po prostu nie istnieją. Prawy klik trafia w <body>. */
    pointer-events: none;
  }

  /* Duży przycisk odtwarzania, który iOS Safari dorysowuje na wideo,
     gdy odmówi autoodtwarzania. Jedyna natywna kontrolka, która potrafi
     pojawić się bez atrybutu controls. */
  #v::-webkit-media-controls-start-playback-button,
  #v::-webkit-media-controls { display: none !important; }

  /* Plakietka pokazywana tylko wtedy, gdy przeglądarka zablokowała dźwięk. */
  #hint {
    position: fixed;
    left: 50%;
    bottom: max(24px, env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    padding: 10px 18px;
    border-radius: 999px;
    font: 500 15px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    background: rgba(0, 0, 0, .55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .35s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  #hint.on { opacity: 1; visibility: visible; }
</style>
</head>
<body>

<!-- Brak atrybutu controls => brak paska, pauzy, suwaka głośności i przewijania.
     Taki element nie przyjmuje fokusu, więc nie reaguje też na klawiaturę.
     disablepictureinpicture / disableremoteplayback usuwają PiP i AirPlay/Cast. -->
<video id="v"
       autoplay
       loop
       muted
       playsinline
       webkit-playsinline
       preload="auto"
       disablepictureinpicture
       disableremoteplayback
       x5-playsinline
       x5-video-player-type="h5-page">
  <!-- ================= KONFIGURACJA PLIKU WIDEO =================
       Wrzuć plik do repo i wpisz go poniżej. Przeglądarka bierze
       pierwsze źródło, które umie odtworzyć; jeśli pliku nie ma (404),
       przechodzi do następnego. Linie bez pliku są ignorowane. -->
  <source src="video.mp4"        type="video/mp4">
  <source src="media/video.mp4"  type="video/mp4">
  <source src="video.webm"       type="video/webm">
  <source src="media/video.webm" type="video/webm">
  <!-- ============================================================ -->
</video>

<div id="hint">Dotknij, aby włączyć dźwięk</div>

<script>
(function () {
  "use strict";

  /* ========================= USTAWIENIA ========================= */
  var VOLUME          = 1.0;   // głośność po odblokowaniu dźwięku
  var AUTO_FULLSCREEN = false; // true = pierwsze dotknięcie wchodzi w pełny ekran
  /* ============================================================== */

  var v    = document.getElementById("v");
  var hint = document.getElementById("hint");

  var locked   = false; // dźwięk gra
  var blocked  = false; // przeglądarka odmówiła — czekamy na dotknięcie
  var noSource = false; // brak pliku wideo
  var retries  = 0;

  /* ---------- 1. Odtwarzanie bez końca ----------
     Strona nie ma czym zatrzymać filmu, ale przeglądarka ma: telefon usypia
     ekran, użytkownik przełącza kartę, system wycisza w tle. W każdym z tych
     przypadków leci zdarzenie `pause` i trzeba wrócić do odtwarzania. */

  function play() {
    var p = v.play();
    if (p && typeof p.catch === "function") p.catch(function () {});
  }

  v.addEventListener("pause", function () { play(); });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) play();
  });
  window.addEventListener("pageshow", play);

  // Zerwana sieć w trakcie streamowania.
  v.addEventListener("stalled", play);
  v.addEventListener("error", function () { setTimeout(play, 1000); });

  // Klawisze multimedialne, ekran blokady, przycisk na słuchawkach — to jedyne
  // sterowanie spoza strony, którego nie da się usunąć, więc pauza jest tu
  // przemapowana na odtwarzanie.
  if ("mediaSession" in navigator) {
    ["play", "pause", "stop", "seekbackward", "seekforward", "seekto",
     "previoustrack", "nexttrack"].forEach(function (a) {
      try { navigator.mediaSession.setActionHandler(a, play); } catch (e) {}
    });
  }

  /* ---------- 2. Dźwięk ----------
     Jedyne miejsce, gdzie strona musi coś obchodzić: przeglądarki blokują
     autoodtwarzanie z dźwiękiem do pierwszej interakcji użytkownika. */

  function soundOn() { locked = true; blocked = false; hideHint(); }

  function soundRefused() {   // film leci dalej, tylko wyciszony
    blocked = true;
    v.muted = true;
    play();
    showHint();
  }

  function goUnmuted(fromGesture) {
    if (locked && !v.muted) return;
    if (blocked && !fromGesture) return;
    if (goUnmuted.busy) return;
    // Dopóki trwa wybór <source> (np. 404 na video.mp4), play() odrzuca promise
    // z AbortError/NotSupportedError — to NIE jest blokada autoodtwarzania.
    if (v.readyState < 2 && !fromGesture) return;

    goUnmuted.busy = true;
    v.muted = false;
    try { v.volume = VOLUME; } catch (e) {}

    var p = v.play();
    if (!p || typeof p.then !== "function") {   // stare silniki bez promise
      goUnmuted.busy = false;
      soundOn();
      return;
    }
    p.then(function () {
      goUnmuted.busy = false;
      soundOn();
    }).catch(function (err) {
      goUnmuted.busy = false;
      if (err && err.name === "NotAllowedError") {
        soundRefused();
      } else if (++retries < 10) {
        setTimeout(function () { goUnmuted(fromGesture); }, 300);
      } else {
        soundRefused();
      }
    });
  }

  function showHint() { if (v.muted && !noSource) hint.classList.add("on"); }
  function hideHint() { if (!noSource) hint.classList.remove("on"); }

  // Dowolna interakcja włącza dźwięk. Nie trzeba w nic trafiać.
  ["pointerdown", "touchstart", "mousedown", "keydown"].forEach(function (ev) {
    window.addEventListener(ev, function () {
      if (locked && !v.muted) return;
      goUnmuted(true);
      if (AUTO_FULLSCREEN) goFullscreen();
    }, { capture: true, passive: true });
  });

  /* ---------- 3. Rozmiar okna i orientacja ----------
     CSS radzi sobie sam wszędzie poza iOS Safari, które po obrocie przez
     chwilę raportuje starą wysokość i zostawia pusty pasek. */

  function fit() {
    v.style.width  = window.innerWidth + "px";
    v.style.height = window.innerHeight + "px";
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function () {
    fit();
    setTimeout(fit, 100);
    setTimeout(fit, 400);
    setTimeout(fit, 900);   // po animacji obrotu
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fit);
  }
  if (screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener("change", function () {
      fit();
      setTimeout(fit, 300);
    });
  }
  v.addEventListener("loadedmetadata", fit);

  /* ---------- 4. Dodatki ---------- */

  // Ekran nie gaśnie w trakcie odtwarzania, jeśli przeglądarka na to pozwala.
  var wakeLock = null;
  function requestWakeLock() {
    if (!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function (l) {
      wakeLock = l;
      l.addEventListener("release", function () { wakeLock = null; });
    }).catch(function () {});
  }
  requestWakeLock();
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && wakeLock === null) requestWakeLock();
  });

  function goFullscreen() {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (fn) { try { fn.call(el); } catch (e) {} }
    if (screen.orientation && screen.orientation.lock) {
      try { screen.orientation.lock("landscape").catch(function () {}); } catch (e) {}
    }
  }

  // Jedyny komunikat na tej stronie: gdy w repo nie ma żadnego z plików
  // wypisanych w <source>. Bez tego widać sam czarny ekran i nie wiadomo,
  // czy to brak pliku, czy film zaczyna się od czarnej klatki.
  setTimeout(function () {
    if (v.networkState === 3 /* NETWORK_NO_SOURCE */ && v.readyState === 0) {
      noSource = true;
      hint.textContent = "Brak pliku wideo — wgraj go do repo (patrz README)";
      hint.classList.add("on");
    }
  }, 4000);

  /* ---------- 5. Start ----------
     Próbę włączenia dźwięku podpinamy pod zdarzenia mediów, a nie pod
     DOMContentLoaded — w chwili, gdy DOM jest gotowy, przeglądarka może
     jeszcze przebierać w <source> i play() odrzuciłoby promise bez powodu. */

  ["loadeddata", "canplay", "canplaythrough", "playing"].forEach(function (ev) {
    v.addEventListener(ev, function () { goUnmuted(false); });
  });
  play();
  goUnmuted(false);
  window.addEventListener("load", function () { play(); goUnmuted(false); });
})();
</script>
</body>
</html>
