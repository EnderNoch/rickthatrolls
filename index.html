<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<!-- A single non-breaking space, not a missing tag. With no <title> at all
     the browser puts the URL in the tab instead, which shows MORE, not less.
     A space renders as no text. -->
<title>&nbsp;</title>
<!-- Transparent 1x1 PNG in place of a real icon. Without it the browser
     requests /favicon.ico, gets a 404 and draws its own fallback glyph. -->
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* Transparent rather than black, so that when the page is embedded in an
       iframe (a Home Assistant card with its background hidden, say) the
       parent shows through the letterbox area. Opened on its own the script
       paints black, because the browser's default canvas is white in light
       mode. */
    background: transparent;
    overflow: hidden;            /* there is nothing to scroll */
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  #v {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* dvw/dvh ignore collapsing browser chrome on mobile. The two lines
       above are the fallback for engines without them. */
    width: 100dvw;
    height: 100dvh;
    /* contain keeps the whole frame visible at any window aspect ratio, and
       the leftover space stays transparent. Switch to `cover` if you would
       rather fill the window and crop the frame instead. */
    object-fit: contain;
    object-position: center center;
    background: transparent;
    display: block;

    /* The video stops being a hit target for cursor and touch. On Chromium
       that alone removes the native video context menu — right-click lands
       on <body> instead. Gecko still shows its menu, which is why the script
       also cancels the contextmenu event. */
    pointer-events: none;
  }

  /* The large play button iOS Safari paints over a video when it refuses to
     autoplay — the one native control that can appear without the controls
     attribute. */
  #v::-webkit-media-controls-start-playback-button,
  #v::-webkit-media-controls { display: none !important; }

  /* Badge, shown only when the browser has refused to play sound. */
  #hint {
    position: fixed;
    /* Centred with auto margins rather than left:50% plus a translate. With
       left:50% the available width is half the viewport, which wrapped long
       translations far earlier than necessary. */
    left: 0;
    right: 0;
    margin-left: auto;
    margin-right: auto;
    width: fit-content;
    bottom: max(24px, env(safe-area-inset-bottom, 0px));
    padding: 10px 18px;
    border-radius: 999px;
    font: 500 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    /* Some translations are long, so the badge wraps instead of running off
       the side of a narrow phone. */
    max-width: min(88vw, 46ch);
    text-align: center;
    background: rgba(0, 0, 0, .55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .35s ease;
    pointer-events: none;
  }
  #hint.on { opacity: 1; visibility: visible; }
</style>
</head>
<body>

<!-- No controls attribute means no control bar, no pause, no volume slider and
     no seeking. Such an element also cannot take focus, so it never receives
     keyboard input. disablepictureinpicture and disableremoteplayback drop
     Picture-in-Picture and AirPlay/Cast. -->
<video id="v"
       autoplay
       loop
       muted
       playsinline
       webkit-playsinline
       preload="auto"
       disablepictureinpicture
       disableremoteplayback
       x5-playsinline
       x5-video-player-type="h5-page">
  <!-- ==================== VIDEO FILE ====================
       Put your file in the repo and list it below. The browser takes the
       first source it can play; a missing file (404) makes it move on to
       the next line, so unused entries cost nothing. -->
  <source src="video.mp4"        type="video/mp4">
  <source src="media/video.mp4"  type="video/mp4">
  <source src="video.webm"       type="video/webm">
  <source src="media/video.webm" type="video/webm">
  <!-- ==================================================== -->
</video>

<!-- Filled in by the script in the browser's language; English is the fallback. -->
<div id="hint"></div>

<script>
(function () {
  "use strict";

  /* ========================= SETTINGS =========================
     Fullscreen and the landscape lock are deliberately not settings: they
     always happen, and turning them off means editing this file. */
  var VOLUME = 1.0;   // volume once sound has been unlocked
  /* ============================================================ */

  /* ===================== BADGE TRANSLATIONS =====================
     The badge appears only when the browser has blocked autoplay with
     sound. The language comes from navigator.languages; anything missing
     falls back to English. Fixing a translation is a one-line edit here. */
  var HINT = {
    "en":      "Tap or click for sound",
    "pl":      "Dotknij lub kliknij, aby włączyć dźwięk",
    "de":      "Tippen oder klicken für Ton",
    "fr":      "Touchez ou cliquez pour activer le son",
    "es":      "Toca o haz clic para activar el sonido",
    "pt":      "Toque ou clique para ativar o som",
    "it":      "Tocca o clicca per attivare l'audio",
    "nl":      "Tik of klik voor geluid",
    "sv":      "Tryck eller klicka för ljud",
    "da":      "Tryk eller klik for lyd",
    "nb":      "Trykk eller klikk for lyd",
    "nn":      "Trykk eller klikk for lyd",
    "is":      "Ýttu eða smelltu fyrir hljóð",
    "fi":      "Napauta tai klikkaa äänen päälle",
    "et":      "Puudutage või klõpsake heli sisselülitamiseks",
    "lv":      "Pieskarieties vai noklikšķiniet, lai ieslēgtu skaņu",
    "lt":      "Palieskite arba spustelėkite, kad įjungtumėte garsą",
    "cs":      "Klepněte nebo klikněte pro zvuk",
    "sk":      "Ťuknite alebo kliknite pre zvuk",
    "sl":      "Dotaknite se ali kliknite za zvok",
    "hr":      "Dodirnite ili kliknite za zvuk",
    "bs":      "Dodirnite ili kliknite za zvuk",
    "sr":      "Додирните или кликните за звук",
    "mk":      "Допрете или кликнете за звук",
    "bg":      "Докоснете или щракнете за звук",
    "ro":      "Atinge sau dă clic pentru sunet",
    "hu":      "Koppintson vagy kattintson a hangért",
    "el":      "Πατήστε ή κάντε κλικ για ήχο",
    "sq":      "Prekni ose klikoni për zë",
    "uk":      "Торкніться або клацніть, щоб увімкнути звук",
    "be":      "Націсніце, каб уключыць гук",
    "ru":      "Нажмите или кликните, чтобы включить звук",
    "kk":      "Дыбысты қосу үшін түртіңіз немесе басыңыз",
    "uz":      "Ovoz uchun bosing",
    "az":      "Səs üçün toxunun və ya klikləyin",
    "tr":      "Ses için dokunun veya tıklayın",
    "ca":      "Toca o fes clic per activar el so",
    "gl":      "Toca ou fai clic para activar o son",
    "eu":      "Ukitu edo egin klik soinua aktibatzeko",
    "ga":      "Tapáil nó cliceáil le haghaidh fuaime",
    "cy":      "Tapiwch neu cliciwch am sain",
    "af":      "Tik of klik vir klank",
    "sw":      "Gusa au bofya kwa sauti",
    "id":      "Ketuk atau klik untuk suara",
    "ms":      "Ketik atau klik untuk bunyi",
    "fil":     "I-tap o i-click para sa tunog",
    "vi":      "Chạm hoặc nhấp để bật âm thanh",
    "th":      "แตะหรือคลิกเพื่อเปิดเสียง",
    "hi":      "ध्वनि के लिए टैप या क्लिक करें",
    "bn":      "শব্দের জন্য ট্যাপ বা ক্লিক করুন",
    "ta":      "ஒலிக்கு தட்டவும் அல்லது கிளிக் செய்யவும்",
    "ja":      "タップまたはクリックで音声オン",
    "ko":      "탭하거나 클릭하면 소리가 켜집니다",
    "zh-hans": "点按或点击以开启声音",
    "zh-hant": "輕觸或點擊以開啟聲音",
    "ar":      "انقر أو المس لتشغيل الصوت",
    "he":      "הקש או לחץ להפעלת הצליל",
    "fa":      "برای صدا لمس یا کلیک کنید",
    "ur":      "آواز کے لیے ٹیپ یا کلک کریں"
  };

  // Right-to-left scripts.
  var RTL = { ar: 1, he: 1, fa: 1, ur: 1 };

  // Legacy language codes some browsers and systems still send.
  var ALIAS = { iw: "he", in: "id", ji: "yi", no: "nb", tl: "fil", mo: "ro" };

  // Only the repo owner sees this, and only while setting the page up, so
  // it exists in the two languages the README does.
  var NOFILE = {
    "en": "No video file — upload it to the repo (see README)",
    "pl": "Brak pliku wideo — wgraj go do repo (patrz README)"
  };

  function pickLang() {
    var list = (navigator.languages && navigator.languages.length)
      ? navigator.languages : [navigator.language || "en"];
    for (var i = 0; i < list.length; i++) {
      var tag  = String(list[i]).toLowerCase();
      var base = tag.split("-")[0];
      base = ALIAS[base] || base;
      if (base === "zh") {
        // Chinese depends on the script, not the country
        return /hant|tw|hk|mo/.test(tag) ? "zh-hant" : "zh-hans";
      }
      if (HINT[tag])  return tag;
      if (HINT[base]) return base;
    }
    return "en";
  }

  var LANG = pickLang();
  /* ================================================================== */

  var v    = document.getElementById("v");
  var hint = document.getElementById("hint");

  /* ---------- Letterbox background ----------
     The CSS leaves the background transparent so an embedded page shows the
     parent through the letterbox area. On its own that would leave the
     browser's default canvas, which is white in light mode. A
     color-scheme:dark meta does not solve it either — that forces an opaque
     dark canvas inside the iframe as well, defeating the point. Hence the
     split on whether we are embedded. Reading window.top can throw
     cross-origin; that case is treated as embedded, which is the safe
     direction, since at worst an embedded page keeps the parent's
     background. */
  var standalone;
  try { standalone = (window.self === window.top); } catch (e) { standalone = false; }
  if (standalone) document.documentElement.style.background = "#000";

  document.documentElement.lang = LANG;
  hint.textContent = HINT[LANG] || HINT.en;
  if (RTL[LANG]) hint.setAttribute("dir", "rtl");

  var locked   = false; // sound is on and playing
  var blocked  = false; // the browser refused; waiting for a gesture
  var noSource = false; // no video file was found
  var retries  = 0;

  /* ---------- 1. Playback that never stops ----------
     The page has no way to stop the video, but the browser does: the phone
     sleeps, the user switches tabs, the system suspends it in the
     background. Each of those fires `pause`, and playback has to resume. */

  function play() {
    var p = v.play();
    if (p && typeof p.catch === "function") p.catch(function () {});
  }

  v.addEventListener("pause", function () { play(); });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) play();
  });
  window.addEventListener("pageshow", play);

  // Connection dropped mid-stream.
  v.addEventListener("stalled", play);
  v.addEventListener("error", function () { setTimeout(play, 1000); });

  // Media keys, the lock screen and the headphone button are the one control
  // surface outside the page that cannot be removed, so pause is remapped
  // onto play.
  if ("mediaSession" in navigator) {
    ["play", "pause", "stop", "seekbackward", "seekforward", "seekto",
     "previoustrack", "nexttrack"].forEach(function (a) {
      try { navigator.mediaSession.setActionHandler(a, play); } catch (e) {}
    });
  }

  /* ---------- 2. Undoing changes to the element ----------
     Reaches anything that changes the state of the <video> itself: the Mute
     and Speed entries in Gecko's native menu, which Shift + right-click
     opens regardless of the preventDefault below, and the DevTools console.

     It does NOT reach muting the tab. The speaker icon on the tab, "Mute
     tab" in the tab's menu and the system mixer all act after the element:
     `muted` and `volume` do not change and no event fires, so the page
     cannot even observe that state, let alone restore it. */
  v.addEventListener("volumechange", function () {
    if (!locked) return;                   // silence before unlocking is deliberate
    if (v.muted) v.muted = false;
    if (Math.abs(v.volume - VOLUME) > 0.001) v.volume = VOLUME;
  });

  v.addEventListener("ratechange", function () {
    if (v.playbackRate !== 1) v.playbackRate = 1;
  });

  /* ---------- 3. Context menu ----------
     On Chromium `pointer-events: none` is enough on its own: the video is
     not a hit target, so right-click lands on <body> and the browser has no
     video menu to offer. Gecko shows its full video menu anyway, measured
     against a real Firefox, so the event is cancelled outright as well.
     Shift + right-click still bypasses this — that is deliberate in Gecko
     and cannot be suppressed, which is why section 2 exists. */
  window.addEventListener("contextmenu", function (e) {
    e.preventDefault();
  }, { capture: true });

  /* ---------- 4. Sound ----------
     The one browser rule this page has to work around: autoplay with sound
     is blocked until the user has interacted with the document. Every
     attempt at circumventing it was measured and none worked, so the page
     asks politely and falls back to muted playback. */

  function soundOn() { locked = true; blocked = false; hideHint(); }

  function soundRefused() {   // the video keeps playing, just muted
    blocked = true;
    v.muted = true;
    play();
    showHint();
  }

  function goUnmuted(fromGesture) {
    if (locked && !v.muted) return;
    if (blocked && !fromGesture) return;
    if (goUnmuted.busy) return;
    // While the browser is still picking a <source> (a 404 on video.mp4, for
    // instance) play() rejects with AbortError or NotSupportedError. That is
    // source selection, not an autoplay block, so it is retried.
    if (v.readyState < 2 && !fromGesture) return;

    goUnmuted.busy = true;
    v.muted = false;
    try { v.volume = VOLUME; } catch (e) {}

    var p = v.play();
    if (!p || typeof p.then !== "function") {   // engines without a play() promise
      goUnmuted.busy = false;
      soundOn();
      return;
    }
    p.then(function () {
      goUnmuted.busy = false;
      soundOn();
    }).catch(function (err) {
      goUnmuted.busy = false;
      if (err && err.name === "NotAllowedError") {
        soundRefused();
      } else if (++retries < 10) {
        setTimeout(function () { goUnmuted(fromGesture); }, 300);
      } else {
        soundRefused();
      }
    });
  }

  function showHint() { if (v.muted && !noSource) hint.classList.add("on"); }
  function hideHint() { if (!noSource) hint.classList.remove("on"); }

  // Any interaction turns on sound and fullscreen. There is no button to hit;
  // the whole window is live.
  ["pointerdown", "touchstart", "mousedown", "keydown"].forEach(function (ev) {
    window.addEventListener(ev, function () {
      // Fullscreen first, before the sound check below. Once sound is on that
      // check returns early, and with the order reversed no later gesture
      // could ever restore fullscreen after the user left it.
      goFullscreen();
      if (locked && !v.muted) return;
      goUnmuted(true);
    }, { capture: true, passive: true });
  });

  /* ---------- 5. Window size and orientation ----------
     The CSS handles this everywhere except iOS Safari, which keeps reporting
     the old height for a moment after a rotation and leaves a blank strip
     behind. */

  function fit() {
    v.style.width  = window.innerWidth + "px";
    v.style.height = window.innerHeight + "px";
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function () {
    fit();
    setTimeout(fit, 100);
    setTimeout(fit, 400);
    setTimeout(fit, 900);   // after the rotation animation settles
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fit);
  }
  if (screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener("change", function () {
      fit();
      setTimeout(fit, 300);
    });
  }
  v.addEventListener("loadedmetadata", fit);

  /* ---------- 6. Fullscreen, orientation and wake lock ---------- */

  // Keep the screen awake while playing, where the browser allows it.
  var wakeLock = null;
  function requestWakeLock() {
    if (!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function (l) {
      wakeLock = l;
      l.addEventListener("release", function () { wakeLock = null; });
    }).catch(function () {});
  }
  requestWakeLock();
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && wakeLock === null) requestWakeLock();
  });

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement ||
              document.msFullscreenElement);
  }

  function hush(p) {                       // swallow the rejection, do not leave it unhandled
    if (p && typeof p.catch === "function") p.catch(function () {});
  }

  // Called from every user gesture. Fullscreen requires one and cannot be
  // requested on load. Leaving fullscreen (Esc, a system gesture) cannot be
  // blocked, but the next gesture puts it back.
  function goFullscreen() {
    if (isFullscreen()) return;
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (!fn) return;                       // iOS Safari has no element fullscreen
    try { hush(fn.call(el)); } catch (e) {}
  }

  // The orientation lock only works while fullscreen is already active, so it
  // runs on the event rather than straight after the request, which would be
  // too early — requestFullscreen is asynchronous.
  function lockLandscape() {
    if (!isFullscreen()) return;
    if (!screen.orientation || !screen.orientation.lock) return;   // iOS ignores it
    try { hush(screen.orientation.lock("landscape")); } catch (e) {}
  }
  ["fullscreenchange", "webkitfullscreenchange", "msfullscreenchange"].forEach(function (ev) {
    document.addEventListener(ev, function () { lockLandscape(); fit(); });
  });

  /* ---------- 7. Missing file ----------
     The only message this page ever shows: none of the files listed in
     <source> exists. Without it you get a black screen and no way to tell a
     missing file from a video that opens on a black frame. */
  setTimeout(function () {
    if (v.networkState === 3 /* NETWORK_NO_SOURCE */ && v.readyState === 0) {
      noSource = true;
      hint.removeAttribute("dir");
      hint.textContent = NOFILE[LANG] || NOFILE.en;
      hint.classList.add("on");
    }
  }, 4000);

  /* ---------- 8. Start ----------
     The attempt at sound hangs off media events rather than DOMContentLoaded.
     By the time the DOM is ready the browser may still be picking a
     <source>, and play() would reject for that reason alone. */

  ["loadeddata", "canplay", "canplaythrough", "playing"].forEach(function (ev) {
    v.addEventListener(ev, function () { goUnmuted(false); });
  });
  play();
  goUnmuted(false);
  window.addEventListener("load", function () { play(); goUnmuted(false); });
})();
</script>
</body>
</html>
