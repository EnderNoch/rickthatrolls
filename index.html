<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>&nbsp;</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;            /* strona nie ma czego przewijać */
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  #v {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* dvw/dvh ignorują chowające się paski przeglądarki na mobile.
       Linie wyżej są fallbackiem dla starszych silników. */
    width: 100dvw;
    height: 100dvh;
    /* contain = cały kadr widoczny zawsze, niezależnie od proporcji okna.
       Nadmiar dopełnia czarne tło. Zamień na `cover`, jeśli wolisz, żeby
       film wypełniał okno bez pasków kosztem przycięcia kadru. */
    object-fit: contain;
    object-position: center center;
    background: #000;
    display: block;

    /* Kluczowa linia. Wideo przestaje być celem trafienia kursora/palca,
       więc przeglądarka nie ma dla niego menu kontekstowego — pozycje
       „Pokaż elementy sterujące", „Zapisz wideo jako…", „Zapętl",
       „Obraz w obrazie" po prostu nie istnieją. Prawy klik trafia w <body>. */
    pointer-events: none;
  }

  /* Duży przycisk odtwarzania, który iOS Safari dorysowuje na wideo,
     gdy odmówi autoodtwarzania. Jedyna natywna kontrolka, która potrafi
     pojawić się bez atrybutu controls. */
  #v::-webkit-media-controls-start-playback-button,
  #v::-webkit-media-controls { display: none !important; }

  /* Plakietka pokazywana tylko wtedy, gdy przeglądarka zablokowała dźwięk. */
  #hint {
    position: fixed;
    /* Centrowanie przez auto-marginesy, a nie left:50% + translate — przy
       left:50% dostępna szerokość to połowa okna i długie tłumaczenia
       łamały się bez potrzeby. */
    left: 0;
    right: 0;
    margin-left: auto;
    margin-right: auto;
    width: fit-content;
    bottom: max(24px, env(safe-area-inset-bottom, 0px));
    padding: 10px 18px;
    border-radius: 999px;
    font: 500 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    /* Tłumaczenia bywają dłuższe od polskiego, więc plakietka może się
       zawinąć zamiast wystawać poza ekran na wąskim telefonie. */
    max-width: min(88vw, 46ch);
    text-align: center;
    background: rgba(0, 0, 0, .55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .35s ease;
    pointer-events: none;
  }
  #hint.on { opacity: 1; visibility: visible; }
</style>
</head>
<body>

<!-- Brak atrybutu controls => brak paska, pauzy, suwaka głośności i przewijania.
     Taki element nie przyjmuje fokusu, więc nie reaguje też na klawiaturę.
     disablepictureinpicture / disableremoteplayback usuwają PiP i AirPlay/Cast. -->
<video id="v"
       autoplay
       loop
       muted
       playsinline
       webkit-playsinline
       preload="auto"
       disablepictureinpicture
       disableremoteplayback
       x5-playsinline
       x5-video-player-type="h5-page">
  <!-- ================= KONFIGURACJA PLIKU WIDEO =================
       Wrzuć plik do repo i wpisz go poniżej. Przeglądarka bierze
       pierwsze źródło, które umie odtworzyć; jeśli pliku nie ma (404),
       przechodzi do następnego. Linie bez pliku są ignorowane. -->
  <source src="video.mp4"        type="video/mp4">
  <source src="media/video.mp4"  type="video/mp4">
  <source src="video.webm"       type="video/webm">
  <source src="media/video.webm" type="video/webm">
  <!-- ============================================================ -->
</video>

<!-- Treść wstawia skrypt w języku przeglądarki; angielski to język zapasowy. -->
<div id="hint"></div>

<script>
(function () {
  "use strict";

  /* ========================= USTAWIENIA =========================
     Pełny ekran i blokada orientacji nie są ustawieniem — dzieją się
     zawsze i nie da się ich wyłączyć bez edycji tego pliku. */
  var VOLUME = 1.0;   // głośność po odblokowaniu dźwięku
  /* ============================================================== */

  /* ===================== TŁUMACZENIA PLAKIETKI =====================
     Plakietka pojawia się tylko wtedy, gdy przeglądarka zablokowała
     autoodtwarzanie z dźwiękiem. Język brany jest z navigator.languages;
     brak wpisu = angielski. Poprawki wystarczy nanieść w tej tabeli. */
  var HINT = {
    "en":      "Tap or click for sound",
    "pl":      "Dotknij lub kliknij, aby włączyć dźwięk",
    "de":      "Tippen oder klicken für Ton",
    "fr":      "Touchez ou cliquez pour activer le son",
    "es":      "Toca o haz clic para activar el sonido",
    "pt":      "Toque ou clique para ativar o som",
    "it":      "Tocca o clicca per attivare l'audio",
    "nl":      "Tik of klik voor geluid",
    "sv":      "Tryck eller klicka för ljud",
    "da":      "Tryk eller klik for lyd",
    "nb":      "Trykk eller klikk for lyd",
    "nn":      "Trykk eller klikk for lyd",
    "is":      "Ýttu eða smelltu fyrir hljóð",
    "fi":      "Napauta tai klikkaa äänen päälle",
    "et":      "Puudutage või klõpsake heli sisselülitamiseks",
    "lv":      "Pieskarieties vai noklikšķiniet, lai ieslēgtu skaņu",
    "lt":      "Palieskite arba spustelėkite, kad įjungtumėte garsą",
    "cs":      "Klepněte nebo klikněte pro zvuk",
    "sk":      "Ťuknite alebo kliknite pre zvuk",
    "sl":      "Dotaknite se ali kliknite za zvok",
    "hr":      "Dodirnite ili kliknite za zvuk",
    "bs":      "Dodirnite ili kliknite za zvuk",
    "sr":      "Додирните или кликните за звук",
    "mk":      "Допрете или кликнете за звук",
    "bg":      "Докоснете или щракнете за звук",
    "ro":      "Atinge sau dă clic pentru sunet",
    "hu":      "Koppintson vagy kattintson a hangért",
    "el":      "Πατήστε ή κάντε κλικ για ήχο",
    "sq":      "Prekni ose klikoni për zë",
    "uk":      "Торкніться або клацніть, щоб увімкнути звук",
    "be":      "Націсніце, каб уключыць гук",
    "ru":      "Нажмите или кликните, чтобы включить звук",
    "kk":      "Дыбысты қосу үшін түртіңіз немесе басыңыз",
    "uz":      "Ovoz uchun bosing",
    "az":      "Səs üçün toxunun və ya klikləyin",
    "tr":      "Ses için dokunun veya tıklayın",
    "ca":      "Toca o fes clic per activar el so",
    "gl":      "Toca ou fai clic para activar o son",
    "eu":      "Ukitu edo egin klik soinua aktibatzeko",
    "ga":      "Tapáil nó cliceáil le haghaidh fuaime",
    "cy":      "Tapiwch neu cliciwch am sain",
    "af":      "Tik of klik vir klank",
    "sw":      "Gusa au bofya kwa sauti",
    "id":      "Ketuk atau klik untuk suara",
    "ms":      "Ketik atau klik untuk bunyi",
    "fil":     "I-tap o i-click para sa tunog",
    "vi":      "Chạm hoặc nhấp để bật âm thanh",
    "th":      "แตะหรือคลิกเพื่อเปิดเสียง",
    "hi":      "ध्वनि के लिए टैप या क्लिक करें",
    "bn":      "শব্দের জন্য ট্যাপ বা ক্লিক করুন",
    "ta":      "ஒலிக்கு தட்டவும் அல்லது கிளிக் செய்யவும்",
    "ja":      "タップまたはクリックで音声オン",
    "ko":      "탭하거나 클릭하면 소리가 켜집니다",
    "zh-hans": "点按或点击以开启声音",
    "zh-hant": "輕觸或點擊以開啟聲音",
    "ar":      "انقر أو المس لتشغيل الصوت",
    "he":      "הקש או לחץ להפעלת הצליל",
    "fa":      "برای صدا لمس یا کلیک کنید",
    "ur":      "آواز کے لیے ٹیپ یا کلک کریں"
  };

  // Języki pisane od prawej do lewej.
  var RTL = { ar: 1, he: 1, fa: 1, ur: 1 };

  // Stare kody języków, które nadal wysyłają niektóre przeglądarki i systemy.
  var ALIAS = { iw: "he", in: "id", ji: "yi", no: "nb", tl: "fil", mo: "ro" };

  // Komunikat diagnostyczny widzi tylko właściciel repo przy konfiguracji,
  // więc wystarcza w tych dwóch językach, w których jest README.
  var NOFILE = {
    "en": "No video file — upload it to the repo (see README)",
    "pl": "Brak pliku wideo — wgraj go do repo (patrz README)"
  };

  function pickLang() {
    var list = (navigator.languages && navigator.languages.length)
      ? navigator.languages : [navigator.language || "en"];
    for (var i = 0; i < list.length; i++) {
      var tag  = String(list[i]).toLowerCase();
      var base = tag.split("-")[0];
      base = ALIAS[base] || base;
      if (base === "zh") {
        // chiński zależy od pisma, nie od kraju
        return /hant|tw|hk|mo/.test(tag) ? "zh-hant" : "zh-hans";
      }
      if (HINT[tag])  return tag;
      if (HINT[base]) return base;
    }
    return "en";
  }

  var LANG = pickLang();
  /* ================================================================== */

  var v    = document.getElementById("v");
  var hint = document.getElementById("hint");

  document.documentElement.lang = LANG;
  hint.textContent = HINT[LANG] || HINT.en;
  if (RTL[LANG]) hint.setAttribute("dir", "rtl");

  var locked   = false; // dźwięk gra
  var blocked  = false; // przeglądarka odmówiła — czekamy na dotknięcie
  var noSource = false; // brak pliku wideo
  var retries  = 0;

  /* ---------- 1. Odtwarzanie bez końca ----------
     Strona nie ma czym zatrzymać filmu, ale przeglądarka ma: telefon usypia
     ekran, użytkownik przełącza kartę, system wycisza w tle. W każdym z tych
     przypadków leci zdarzenie `pause` i trzeba wrócić do odtwarzania. */

  function play() {
    var p = v.play();
    if (p && typeof p.catch === "function") p.catch(function () {});
  }

  v.addEventListener("pause", function () { play(); });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) play();
  });
  window.addEventListener("pageshow", play);

  // Zerwana sieć w trakcie streamowania.
  v.addEventListener("stalled", play);
  v.addEventListener("error", function () { setTimeout(play, 1000); });

  // Klawisze multimedialne, ekran blokady, przycisk na słuchawkach — to jedyne
  // sterowanie spoza strony, którego nie da się usunąć, więc pauza jest tu
  // przemapowana na odtwarzanie.
  if ("mediaSession" in navigator) {
    ["play", "pause", "stop", "seekbackward", "seekforward", "seekto",
     "previoustrack", "nexttrack"].forEach(function (a) {
      try { navigator.mediaSession.setActionHandler(a, play); } catch (e) {}
    });
  }

  /* ---------- 2. Dźwięk ----------
     Jedyne miejsce, gdzie strona musi coś obchodzić: przeglądarki blokują
     autoodtwarzanie z dźwiękiem do pierwszej interakcji użytkownika. */

  function soundOn() { locked = true; blocked = false; hideHint(); }

  function soundRefused() {   // film leci dalej, tylko wyciszony
    blocked = true;
    v.muted = true;
    play();
    showHint();
  }

  function goUnmuted(fromGesture) {
    if (locked && !v.muted) return;
    if (blocked && !fromGesture) return;
    if (goUnmuted.busy) return;
    // Dopóki trwa wybór <source> (np. 404 na video.mp4), play() odrzuca promise
    // z AbortError/NotSupportedError — to NIE jest blokada autoodtwarzania.
    if (v.readyState < 2 && !fromGesture) return;

    goUnmuted.busy = true;
    v.muted = false;
    try { v.volume = VOLUME; } catch (e) {}

    var p = v.play();
    if (!p || typeof p.then !== "function") {   // stare silniki bez promise
      goUnmuted.busy = false;
      soundOn();
      return;
    }
    p.then(function () {
      goUnmuted.busy = false;
      soundOn();
    }).catch(function (err) {
      goUnmuted.busy = false;
      if (err && err.name === "NotAllowedError") {
        soundRefused();
      } else if (++retries < 10) {
        setTimeout(function () { goUnmuted(fromGesture); }, 300);
      } else {
        soundRefused();
      }
    });
  }

  function showHint() { if (v.muted && !noSource) hint.classList.add("on"); }
  function hideHint() { if (!noSource) hint.classList.remove("on"); }

  // Dowolna interakcja włącza dźwięk i pełny ekran. Nie trzeba w nic trafiać.
  ["pointerdown", "touchstart", "mousedown", "keydown"].forEach(function (ev) {
    window.addEventListener(ev, function () {
      // Pełny ekran przed sprawdzeniem dźwięku: gdy ktoś wyjdzie z pełnego
      // ekranu, dźwięk już gra, a wcześniejszy wczesny return sprawiał, że
      // żadne kolejne dotknięcie nie wracało do pełnego ekranu.
      goFullscreen();
      if (locked && !v.muted) return;
      goUnmuted(true);
    }, { capture: true, passive: true });
  });

  /* ---------- 3. Rozmiar okna i orientacja ----------
     CSS radzi sobie sam wszędzie poza iOS Safari, które po obrocie przez
     chwilę raportuje starą wysokość i zostawia pusty pasek. */

  function fit() {
    v.style.width  = window.innerWidth + "px";
    v.style.height = window.innerHeight + "px";
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function () {
    fit();
    setTimeout(fit, 100);
    setTimeout(fit, 400);
    setTimeout(fit, 900);   // po animacji obrotu
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fit);
  }
  if (screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener("change", function () {
      fit();
      setTimeout(fit, 300);
    });
  }
  v.addEventListener("loadedmetadata", fit);

  /* ---------- 4. Dodatki ---------- */

  // Ekran nie gaśnie w trakcie odtwarzania, jeśli przeglądarka na to pozwala.
  var wakeLock = null;
  function requestWakeLock() {
    if (!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function (l) {
      wakeLock = l;
      l.addEventListener("release", function () { wakeLock = null; });
    }).catch(function () {});
  }
  requestWakeLock();
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && wakeLock === null) requestWakeLock();
  });

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement ||
              document.msFullscreenElement);
  }

  function hush(p) {                       // promise bez nieobsłużonego odrzucenia
    if (p && typeof p.catch === "function") p.catch(function () {});
  }

  // Wołane z każdego gestu użytkownika — pełny ekran wymaga gestu i nie da się
  // go zażądać przy ładowaniu strony. Wyjście z pełnego ekranu (Esc, gest
  // systemowy) jest nie do zablokowania, ale kolejne dotknięcie wraca.
  function goFullscreen() {
    if (isFullscreen()) return;
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (!fn) return;                       // iOS Safari nie ma pełnego ekranu dla elementu
    try { hush(fn.call(el)); } catch (e) {}
  }

  // Blokada orientacji działa dopiero, gdy pełny ekran jest już aktywny,
  // więc próbujemy jej po zdarzeniu, a nie zaraz po żądaniu.
  function lockLandscape() {
    if (!isFullscreen()) return;
    if (!screen.orientation || !screen.orientation.lock) return;   // iOS ignoruje
    try { hush(screen.orientation.lock("landscape")); } catch (e) {}
  }
  ["fullscreenchange", "webkitfullscreenchange", "msfullscreenchange"].forEach(function (ev) {
    document.addEventListener(ev, function () { lockLandscape(); fit(); });
  });

  // Jedyny komunikat na tej stronie: gdy w repo nie ma żadnego z plików
  // wypisanych w <source>. Bez tego widać sam czarny ekran i nie wiadomo,
  // czy to brak pliku, czy film zaczyna się od czarnej klatki.
  setTimeout(function () {
    if (v.networkState === 3 /* NETWORK_NO_SOURCE */ && v.readyState === 0) {
      noSource = true;
      hint.removeAttribute("dir");
      hint.textContent = NOFILE[LANG] || NOFILE.en;
      hint.classList.add("on");
    }
  }, 4000);

  /* ---------- 5. Start ----------
     Próbę włączenia dźwięku podpinamy pod zdarzenia mediów, a nie pod
     DOMContentLoaded — w chwili, gdy DOM jest gotowy, przeglądarka może
     jeszcze przebierać w <source> i play() odrzuciłoby promise bez powodu. */

  ["loadeddata", "canplay", "canplaythrough", "playing"].forEach(function (ev) {
    v.addEventListener(ev, function () { goUnmuted(false); });
  });
  play();
  goUnmuted(false);
  window.addEventListener("load", function () { play(); goUnmuted(false); });
})();
</script>
</body>
</html>
